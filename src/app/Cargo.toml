[package]
name = "evot"
version.workspace = true
edition.workspace = true
repository = "https://github.com/evotai/evot"
autotests = false

[dependencies]
evot-engine.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64 = "0.22"
chrono.workspace = true
clap.workspace = true
futures.workspace = true
fs2 = "=0.4.3"
indexmap.workspace = true
native-tls = "0.2"
parking_lot.workspace = true
prost = "0.13"
regex = "1"
reqwest.workspace = true
similar = { workspace = true }
serde.workspace = true
serde_ignored.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-width = "0.2"
uuid.workspace = true
tempfile = "3"
hostname = "0.4"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "bin/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[lints.clippy]
module_inception = "allow"
should_implement_trait = "allow"
approx_constant = "allow"

[dev-dependencies]
insta = { version = "1", features = ["json", "yaml", "redactions"] }
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

[[test]]
name = "integration"
path = "tests/main.rs"

[build-dependencies]
chrono = "0.4"
