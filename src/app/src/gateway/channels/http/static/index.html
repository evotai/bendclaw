<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat · evot</title>
    <link rel="icon" type="image/png" href="/brand/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/ui/app.css" />
    <link rel="stylesheet" href="/ui/chat.css" />
  </head>
  <body>
    <div class="chat-app">
      <aside class="chat-sidebar">
        <a class="chat-brand" href="/" aria-label="Evot sessions">
          <span class="chat-mark" aria-hidden="true">◆</span>
          <span>evot</span>
        </a>

        <button class="new-chat" id="newChat" type="button">
          <span aria-hidden="true">＋</span><span>New chat</span>
        </button>
        <button class="session-search" id="openSearch" type="button">
          <span aria-hidden="true">⌕</span><span>Search sessions</span><kbd>⌘K</kbd>
        </button>
        <div class="sidebar-label">Recent</div>
        <nav class="recent-sessions" id="recentSessions" aria-label="Recent sessions">
          <div class="sidebar-empty" aria-busy="true">
            <div class="sk-row"><span class="sk wide"></span></div>
            <div class="sk-row"><span class="sk mid"></span></div>
            <div class="sk-row"><span class="sk wide"></span></div>
            <div class="sk-row"><span class="sk mid"></span></div>
            <div class="sk-row"><span class="sk wide"></span></div>
          </div>
        </nav>
        <nav class="sidebar-links" aria-label="Console">
          <a href="/models">Models</a>
          <a href="/feishu">Feishu</a>
        </nav>
        <div class="sidebar-auth" id="authBox" aria-live="polite"></div>
      </aside>

      <main class="conversation hero" id="conversation">
        <header class="conversation-head">
          <div>
            <div class="conversation-title" id="sessionTitle">New chat</div>
            <div class="conversation-meta" id="sessionMeta">Start a new session</div>
          </div>
          <a class="head-link" id="traceLink" href="/sessions" hidden>Trace</a>
        </header>

        <div class="chat-scroll" id="chat" aria-live="polite">
          <div class="welcome" id="welcome">
            <div class="welcome-mark" aria-hidden="true">◆</div>
            <h1>What can I help you build?</h1>
            <p>Ask about this project, make a change, or continue a saved session.</p>
            <button class="workspace-chip" id="workspaceChip" type="button" aria-haspopup="dialog">
              <span class="workspace-folder" aria-hidden="true">⌂</span>
              <span id="workspaceLabel">Choose workspace</span>
            </button>
            <div class="suggestions">
              <button type="button" data-prompt="Explain this codebase and its architecture">Explain this codebase</button>
              <button type="button" data-prompt="Find the most important bugs to fix next">Find important bugs</button>
              <button type="button" data-prompt="Run the relevant tests and summarize the result">Run relevant tests</button>
            </div>
          </div>
        </div>

        <button class="to-bottom" id="toBottom" type="button" aria-label="Scroll to latest" hidden>
          <span aria-hidden="true">↓</span>
        </button>

        <div class="composer-seat" data-composer-seat>
          <div id="noticeSlot" aria-live="polite"></div>
          <div class="composer-card">
            <textarea
              id="input"
              rows="1"
              placeholder="Ask anything, @ to mention, / for commands"
              aria-label="Message"
            ></textarea>
            <div class="composer-row">
              <div class="composer-tools">
                <div class="command-picker">
                  <button
                    class="round-tool"
                    id="commandBtn"
                    type="button"
                    aria-label="Commands"
                    aria-haspopup="listbox"
                    aria-expanded="false"
                    aria-controls="commandMenu"
                  >＋</button>
                  <div class="command-menu" id="commandMenu" role="listbox" aria-label="Commands" hidden>
                    <button type="button" role="option" data-command="/clear">
                      <span><strong>Clear session</strong><small>Start this session over</small></span><kbd>/clear</kbd>
                    </button>
                    <button type="button" role="option" data-command="/compact ">
                      <span><strong>Compact context</strong><small>Summarize older conversation</small></span><kbd>/compact</kbd>
                    </button>
                    <button type="button" role="option" data-command="/clip all">
                      <span><strong>Save to memory</strong><small>Archive durable knowledge</small></span><kbd>/clip all</kbd>
                    </button>
                  </div>
                </div>
              </div>
              <div class="composer-trailing">
                <div class="seat-picker" id="modelPicker">
                  <button
                    class="seat-trigger"
                    id="modelSelect"
                    type="button"
                    aria-label="Model"
                    aria-haspopup="listbox"
                    aria-expanded="false"
                    aria-controls="modelMenu"
                    disabled
                  ><span class="seat-label" id="modelLabel">Model</span></button>
                  <div class="seat-menu" id="modelMenu" role="listbox" aria-label="Models" hidden></div>
                </div>
                <div class="seat-picker effort-picker" id="thinkingPicker" hidden>
                  <button
                    class="seat-trigger"
                    id="thinkingSelect"
                    type="button"
                    aria-label="Thinking level"
                    aria-haspopup="listbox"
                    aria-expanded="false"
                    aria-controls="thinkingMenu"
                    disabled
                  ><span class="seat-label" id="thinkingLabel">Thinking</span></button>
                  <div class="seat-menu" id="thinkingMenu" role="listbox" aria-label="Thinking levels" hidden></div>
                </div>
                <span class="context-meter" id="contextMeter" hidden>
                  <button
                    class="context-trigger"
                    id="contextTrigger"
                    type="button"
                    aria-haspopup="dialog"
                    aria-expanded="false"
                  >
                    <svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true">
                      <circle class="context-track" cx="7" cy="7" r="5.5" />
                      <circle class="context-fill" id="contextFill" cx="7" cy="7" r="5.5" transform="rotate(-90 7 7)" />
                    </svg>
                  </button>
                  <div class="context-panel" id="contextPanel" role="dialog" aria-label="Context used" hidden></div>
                </span>
                <button class="send-btn" id="sendBtn" type="button" aria-label="Send message" disabled>↑</button>
              </div>
            </div>
          </div>
          <div class="stats-line" id="statsLine" hidden></div>
        </div>
      </main>
    </div>

    <div class="search-overlay" id="searchOverlay" aria-hidden="true">
      <div class="search-panel" role="dialog" aria-modal="true" aria-label="Search sessions">
        <input id="searchInput" type="search" placeholder="Search chats by title, path, or message content…" autocomplete="off" />
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/ui/chat.js"></script>
  </body>
</html>
