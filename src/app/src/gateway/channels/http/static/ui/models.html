<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Models · evot</title>
    <link rel="icon" type="image/png" href="/brand/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/ui/app.css" />
    <style>
      .page-actions { flex-wrap: wrap; }
      .default-thinking { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
      .default-thinking select { width: auto; min-width: 118px; height: 32px; padding-block: 0; }

      .model-section { border: 1px solid var(--line); background: var(--bg); }
      .section-head {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 54px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
      }
      .section-copy { flex: 1; min-width: 0; }
      .section-copy h2 { font-size: 14px; font-weight: 650; }
      .section-copy p { margin-top: 3px; color: var(--muted); font-size: 11.5px; }
      .section-count { color: var(--faint); font-size: 11px; }

      /* Cloud is intentionally just a compact read-only directory. Account
         models are refreshed at startup, so an editor here would imply changes
         that cannot persist. */
      .cloud-list { display: grid; }
      .cloud-row {
        display: grid;
        grid-template-columns: minmax(130px, 210px) minmax(0, 1fr);
        align-items: center;
        gap: 14px;
        min-height: 58px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
      }
      .cloud-row:last-child { border-bottom: 0; }
      .provider-name { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; font-weight: 600; }
      .provider-name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .model-chips { display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; }
      .model-chip { padding: 3px 7px; border-radius: 10px; background: var(--fill); color: var(--muted); font-size: 11px; }
      /* Cloud chips pick the account default; the active one is pinned. */
      button.model-chip {
        border: 1px solid transparent;
        font: inherit;
        cursor: pointer;
      }
      button.model-chip:hover { background: var(--page); color: var(--ink); border-color: var(--line); }
      button.model-chip.active {
        border-color: #5f87ff66;
        background: #5f87ff1f;
        color: var(--ink);
        font-weight: 600;
      }
      .row-actions { display: flex; align-items: center; gap: 7px; }
      .default-label { color: var(--green-ink); font-size: 11px; font-weight: 600; }

      /* Only Custom has an editor. */
      .custom-body { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 390px; }
      .custom-list { border-right: 1px solid var(--line); }
      .custom-item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 43px;
        padding: 8px 12px;
        border: 0;
        border-bottom: 1px solid var(--line);
        border-left: 2px solid transparent;
        background: transparent;
        color: var(--muted);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .custom-item:hover { background: var(--fill); color: var(--ink); }
      .custom-item[aria-selected="true"] { border-left-color: var(--ink); background: var(--fill); color: var(--ink); }
      .custom-item .name { flex: 1; min-width: 0; overflow: hidden; font-size: 12.5px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
      .custom-item .state { color: var(--faint); font-size: 10.5px; }
      .custom-editor { padding: 15px; }
      .editor-head { display: flex; align-items: center; gap: 9px; margin-bottom: 15px; }
      .editor-head h3 { font-size: 15px; font-weight: 650; }
      .editor-head .actions { display: flex; gap: 7px; margin-left: auto; }
      .envpath { color: var(--faint); font-size: 11px; }
      .envpath code { color: var(--muted); }
      .section-empty { padding: 24px 14px; color: var(--muted); font-size: 12px; text-align: center; }

      @media (max-width: 820px) {
        .cloud-row { grid-template-columns: 1fr; gap: 8px; }
        .row-actions { justify-content: flex-start; }
        .custom-body { grid-template-columns: 1fr; }
        .custom-list { border-right: 0; border-bottom: 1px solid var(--line); }
      }
    </style>
  </head>
  <body></body>
  <script type="module" src="/ui/models.js"></script>
</html>
